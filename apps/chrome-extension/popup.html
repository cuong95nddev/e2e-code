<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 220px;
    font-family: "Geist", "Inter", ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    background: #09090b;
    color: #fafafa;
    padding: 10px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #a1a1aa;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3f3f46;
    flex-shrink: 0;
  }
  .dot.connected { background: #22c55e; }
  .dot.recording { background: #f87171; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .timer {
    font-size: 11px;
    color: #a1a1aa;
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
    font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
    letter-spacing: 0.05em;
  }
  button {
    width: 100%;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #18181b;
    color: #fafafa;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.4;
  }
  button:hover { background: #27272a; border-color: rgba(255,255,255,0.18); }
  button.start { border-color: rgba(255,255,255,0.2); color: #fafafa; }
  button.stop  { border-color: rgba(248,113,113,0.4); color: #f87171; background: rgba(248,113,113,0.08); }
  button.stop:hover { background: rgba(248,113,113,0.14); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .events {
    font-size: 10px;
    color: #71717a;
    margin-top: 7px;
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="status">
    <div class="dot" id="conn-dot"></div>
    <span id="conn-label">Checking connection…</span>
  </div>
  <div class="timer" id="timer" style="display:none"></div>
  <button id="btn" disabled>Start Recording</button>
  <div class="events" id="event-count"></div>
  <script src="popup.js"></script>
</body>
</html>
